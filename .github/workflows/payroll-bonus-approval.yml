name: Payroll Bonus Approval Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  payroll-bonus-approval:
    name: Payroll Bonus Approval Workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run Payroll Approval Tests
        run: npm test -- --testPathPattern="payroll" --ci
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-32-chars-minimum
