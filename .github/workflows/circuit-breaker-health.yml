name: Circuit Breaker Health Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  circuit-breaker-check:
    name: Circuit Breaker Health & Incident Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run Circuit Breaker Tests
        run: npm test -- --testPathPattern="circuitBreaker" --ci
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-32-chars-minimum
