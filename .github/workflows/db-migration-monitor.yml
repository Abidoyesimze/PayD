name: DB Migration Status Monitoring

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  migration-monitor:
    name: DB Migration Integrity & Drift Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Audit Migration Sequence & Drift
        run: npx ts-node scripts/audit-migrations.ts
        working-directory: backend
        continue-on-error: false

      - name: Run Migration Status Service Tests
        run: npm test -- --testPathPattern="migrationStatusService" --ci
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-32-chars-minimum
