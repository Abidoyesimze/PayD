name: Orchestration Workflow Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  workflows:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: workflow_test
          POSTGRES_DB: payd_workflows
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: backend
      - run: npm run test:workflows
        working-directory: backend
        env:
          WORKFLOW_TEST_DATABASE_URL: postgres://postgres:workflow_test@localhost:5432/payd_workflows
