name: Circuit Breaker Auto-Recovery

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  circuit-breaker-auto-recovery:
    name: Circuit Breaker Recovery Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Test Circuit Breaker Recovery Mechanisms
        run: npm test -- --testPathPattern="circuitBreaker" --ci
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-32-chars-minimum
